apiVersion: apps/v1
kind: Deployment

metadata:
  name: sentinel-score-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: sentinel-score

  template:
    metadata:
      labels:
        app: sentinel-score

    spec:
      containers:
        - name: scoreapi-container
          image: sent-score-api:v3
          imagePullPolicy: IfNotPresent

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"