[project]
name = "sentinel-investigator-assistant"
version = "0.1.0"
description = "SENTINEL fraud investigator assistant: Hybrid Graph RAG over Supabase, Neo4j and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "qdrant-client>=1.12",
    "google-genai>=1.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Only needed for the one-off graph load and for drawing the architecture diagram.
tools = [
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
default-groups = ["dev", "tools"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs live database credentials (run with RUN_INTEGRATION=1)",
]
